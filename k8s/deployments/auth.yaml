apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: campus-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: auth-service
          image: auth-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          envFrom:
            - secretRef:
                name: auth-service-secret
          env:
            - name: CLIENT_URL
              value: http://localhost:8080
            - name: AUTH_SERVICE_URL
              value: http://auth-service.campus-shop.svc.cluster.local
            - name: ITEMS_SERVICE_URL
              value: http://items-service.campus-shop.svc.cluster.local
            - name: BIDDING_SERVICE_URL
              value: http://bidding-service.campus-shop.svc.cluster.local
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for Postgres to be ready...";
              echo "Running migrations...";
              npx sequelize-cli db:migrate;
              echo "Starting app...";
              npm start;
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: campus-shop
spec:
  ports:
    - port: 80
      targetPort: 5001
  selector:
    app: auth-service
