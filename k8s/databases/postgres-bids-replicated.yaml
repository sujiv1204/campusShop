apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-bids-config
  namespace: campus-shop
data:
  setup-primary.sh: |
    #!/bin/bash
    # This script runs in docker-entrypoint-initdb.d for primary only
    echo "Setting up replication configuration for primary..."
    
    # Add replication settings to postgresql.conf
    cat >> "$PGDATA/postgresql.conf" <<EOF
    wal_level = replica
    max_wal_senders = 3
    max_replication_slots = 3
    hot_standby = on
    EOF
    
    # Add replication user to pg_hba.conf
    echo "host replication replicator 0.0.0.0/0 md5" >> "$PGDATA/pg_hba.conf"
    
    # Create replication user
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        DO \$\$
        BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'replicator') THEN
                CREATE USER replicator WITH REPLICATION ENCRYPTED PASSWORD '$POSTGRES_PASSWORD';
            END IF;
        END
        \$\$;
    EOSQL
    
    echo "Primary replication setup complete"
  
  init-replica.sh: |
    #!/bin/bash
    set -e
    
    PGDATA="/var/lib/postgresql/data/pgdata"
    
    if [ ! -s "$PGDATA/PG_VERSION" ]; then
      echo "Replica data directory is empty, cloning from primary..."
      
      until pg_isready -h postgres-bids-0.postgres-bids-headless.campus-shop.svc.cluster.local -p 5432; do
        echo "Waiting for primary to be ready..."
        sleep 5
      done
      
      echo "Primary is ready. Starting pg_basebackup..."
      PGPASSWORD=$REPLICATION_PASSWORD pg_basebackup \
        -h postgres-bids-0.postgres-bids-headless.campus-shop.svc.cluster.local \
        -U replicator \
        -D $PGDATA \
        -P \
        -R \
        --wal-method=stream
      
      echo "Replica initialization complete"
    else
      echo "Replica data directory already exists, skipping initialization"
    fi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-bids-headless
  namespace: campus-shop
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-bids
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-bids-primary
  namespace: campus-shop
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-bids
    role: primary
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-bids-replica
  namespace: campus-shop
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-bids
    role: replica
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-bids
  namespace: campus-shop
spec:
  serviceName: postgres-bids-headless
  replicas: 2
  selector:
    matchLabels:
      app: postgres-bids
  template:
    metadata:
      labels:
        app: postgres-bids
    spec:
      initContainers:
        - name: init-replication
          image: postgres:15
          command:
            - bash
            - -c
            - |
              if [[ "$HOSTNAME" != "postgres-bids-0" ]]; then
                bash /scripts/init-replica.sh
              else
                echo "Primary pod, skipping replica initialization"
              fi
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-bids-secret
                  key: POSTGRES_PASSWORD
          envFrom:
            - secretRef:
                name: postgres-bids-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /scripts
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-bids-secret
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /docker-entrypoint-initdb.d/setup-primary.sh
              subPath: setup-primary.sh
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: postgres-bids-config
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
