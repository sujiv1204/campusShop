apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: campus-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
    spec:
      containers:
        - name: notifications-service
          image: notifications-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5004
          envFrom:
            - secretRef:
                name: notifications-service-secret
          env:
            - name: KAFKA_BROKER
              value: kafka-service.campus-shop.svc.cluster.local:9092
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_URI
            - name: CLIENT_URL
              value: http://localhost
            - name: AUTH_SERVICE_URL
              value: http://auth-service.campus-shop.svc.cluster.local
            - name: ITEMS_SERVICE_URL
              value: http://items-service.campus-shop.svc.cluster.local
            - name: BIDDING_SERVICE_URL
              value: http://bidding-service.campus-shop.svc.cluster.local
            - name: PROFILE_SERVICE_URL
              value: http://profile-service.campus-shop.svc.cluster.local
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for Postgres to be ready...";
              echo "Running migrations...";
              npx sequelize-cli db:migrate;
              echo "Starting app...";
              npm start;
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  namespace: campus-shop
spec:
  ports:
    - port: 80
      targetPort: 5004
  selector:
    app: notifications-service
