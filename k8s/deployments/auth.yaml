apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: DB_HOST
              value: postgres-auth
            - name: DB_USER
              value: admin
            - name: DB_PASSWORD
              value: secret_password
            - name: DB_NAME
              value: auth_db
            - name: DB_PORT
              value: "5432"
            - name: CLIENT_URL
              value: http://localhost
            - name: EMAIL_HOST
              value: smtp-relay.brevo.com
            - name: EMAIL_PORT
              value: "587"
            - name: EMAIL_USER
              value: 97d919002@smtp-brevo.com
            - name: EMAIL_PASS
              value: DghMEdbUcZ2tHC98
            - name: EMAIL_FROM
              value: '"Campus Shop" <sujivraj1204@gmail.com>'
            - name : JWT_SECRET
              value: yh3LtRFJ7V84Sr0QBG0vV08XFT4XMuxU4JPSzrzKLNbcu/R2QBQG5SJkrck6H0IwovxjFhGsphjg/yQl
            - name: AUTH_SERVICE_URL
              value: http://auth-service.app.svc.cluster.local
            - name: ITEMS_SERVICE_URL
              value: http://items-service.app.svc.cluster.local
            - name: BIDDING_SERVICE_URL
              value: http://bidding-service.app.svc.cluster.local
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for Postgres to be ready...";
              echo "Running migrations...";
              npx sequelize-cli db:migrate;
              echo "Starting app...";
              npm start;
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: app
spec:
  ports:
    - port: 80
      targetPort: 5001
  selector:
    app: auth-service
